spring.application.name=stockdeck
server.port=${PORT:8080}

# H2 database connection (Zero config)
spring.datasource.url=jdbc:h2:mem:stockdeckdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Static resources mapping (useful if we want html served natively)
spring.web.resources.static-locations=classpath:/static/
