spring.application.name=stockdeck
server.port=${PORT:8080}

# MySQL database connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stockdeck?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Static resources mapping (useful if we want html served natively)
spring.web.resources.static-locations=classpath:/static/
