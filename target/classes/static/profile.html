<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - StockDeck</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <nav class="topbar">
        <button id="mobileMenuBtn" class="mobile-menu-btn">☰</button>
        <a href="dashboard.html" class="brand">StockDeck</a>
        <div class="links" style="display: flex; align-items: center;">
            <button id="theme-toggle" class="theme-toggle">☀️</button>
        </div>
    </nav>

    <div class="app-container">
        <aside class="sidebar" style="display: flex; flex-direction: column; justify-content: space-between;">
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="calculator.html">Calculator</a></li>
                <li><a href="history.html">History</a></li>
                <li><a href="strategy.html">Strategy Analyzer</a></li>
                <li><a href="profile.html" class="active">⚙️ Profile Settings</a></li>
                <li style="margin-top: 1rem;">
                    <a href="#" onclick="localStorage.clear(); window.location.href='login.html'; return false;" style="color: var(--danger-color); display: flex; align-items: center; gap: 0.5rem; font-weight: 500;">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg> 
                        Logout
                    </a>
                </li>
            </ul>
            <div class="sidebar-logo" style="padding: 1.5rem; text-align: center; margin-top: auto; opacity: 1; display: flex; flex-direction: column; align-items: center; gap: 1rem;">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.3)); color: var(--text-color);">
                    <path d="M3 3V21H21" stroke="currentColor" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M7 14L11 9L15 13L21 5" stroke="var(--primary-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="21" cy="5" r="3" fill="var(--primary-color)"/>
                    <circle cx="15" cy="13" r="2" fill="currentColor" fill-opacity="0.3"/>
                    <circle cx="11" cy="9" r="2" fill="currentColor" fill-opacity="0.3"/>
                    <circle cx="7" cy="14" r="2" fill="currentColor" fill-opacity="0.3"/>
                </svg>
                <div style="font-size: 0.8rem; letter-spacing: 0.1em; color: var(--text-color); opacity: 0.8; font-weight: 600; text-transform: uppercase;">Pro Analytics</div>
            </div>
        </aside>

        <main class="main-content">
            <h2 style="font-size: 2rem; margin-bottom: 2rem; letter-spacing: -0.02em;">⚙️ Profile Settings</h2>

            <div class="charts-grid" style="grid-template-columns: 1fr 1fr; gap: 2rem;">
                <!-- Profile Information -->
                <div class="glass-panel" style="padding: 2.5rem; border-radius: 20px;">
                    <h3 style="margin-bottom: 1.5rem;">User Information</h3>
                    <form id="profileForm">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" required>
                        </div>
                        <button type="submit" id="updateProfileBtn" class="btn btn-primary" style="width: 100%; padding: 0.85rem;">Update Profile</button>
                    </form>
                </div>

                <!-- Change Password -->
                <div class="glass-panel" style="padding: 2.5rem; border-radius: 20px;">
                    <h3 style="margin-bottom: 1.5rem;">Change Password</h3>
                    <form id="passwordForm">
                        <div class="form-group">
                            <label for="oldPassword">Current Password</label>
                            <input type="password" id="oldPassword" required>
                        </div>
                        <div class="form-group">
                            <label for="newPassword">New Password</label>
                            <input type="password" id="newPassword" required>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Confirm New Password</label>
                            <input type="password" id="confirmPassword" required>
                        </div>
                        <button type="submit" id="updatePasswordBtn" class="btn btn-primary" style="width: 100%; padding: 0.85rem;">Change Password</button>
                    </form>
                </div>
            </div>

            <!-- Danger Zone -->
            <div class="glass-panel" style="padding: 2.5rem; border-radius: 20px; margin-top: 2rem; border-top: 4px solid var(--danger-color);">
                <h3 style="margin-bottom: 1rem; color: var(--danger-color);">Danger Zone</h3>
                <p style="opacity: 0.8; margin-bottom: 1.5rem;">Once you delete your account, there is no going back. Please be certain.</p>
                <button id="deleteAccountBtn" class="btn btn-danger">🗑️ Delete Account</button>
            </div>
        </main>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/mobile.js"></script>
    <script>
        const userId = localStorage.getItem('userId');
        if (!userId) {
            window.location.href = 'login.html';
        }

        async function loadProfile() {
            try {
                const res = await fetch(`/api/auth/user/${userId}`);
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('username').value = data.username;
                    document.getElementById('email').value = data.email;
                }
            } catch (err) {
                console.error(err);
                showToast('Failed to load profile', 'error');
            }
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const btn = document.getElementById('updateProfileBtn');
            btn.disabled = true;
            btn.textContent = 'Updating...';

            try {
                const res = await fetch(`/api/auth/user/${userId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('username', data.username);
                    showToast('Profile updated!', 'success');
                } else {
                    showToast(data.error || 'Failed to update', 'error');
                }
            } catch (err) {
                showToast('Network error', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Update Profile';
            }
        });

        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                showToast('Passwords do not match', 'error');
                return;
            }

            const btn = document.getElementById('updatePasswordBtn');
            btn.disabled = true;
            btn.textContent = 'Changing...';

            try {
                const res = await fetch(`/api/auth/user/${userId}/password`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ oldPassword, newPassword })
                });
                const data = await res.json();
                if (res.ok) {
                    showToast('Password changed successfully!', 'success');
                    document.getElementById('passwordForm').reset();
                } else {
                    showToast(data.error || 'Failed to change password', 'error');
                }
            } catch (err) {
                showToast('Network error', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Change Password';
            }
        });

        document.getElementById('deleteAccountBtn').addEventListener('click', async () => {
            if (confirm('Are you ABSOLUTELY sure you want to delete your account? This will erase all history.')) {
                try {
                    const res = await fetch(`/api/auth/user/${userId}`, { method: 'DELETE' });
                    if (res.ok) {
                        alert('Account deleted.');
                        localStorage.clear();
                        window.location.href = 'register.html';
                    } else {
                        showToast('Failed to delete account', 'error');
                    }
                } catch (err) {
                    showToast('Network error', 'error');
                }
            }
        });

        loadProfile();
    </script>
</body>
</html>
