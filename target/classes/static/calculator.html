<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - StockDeck</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="dashboard.html" class="brand">StockDeck</a>
        <div class="links" style="display: flex; align-items: center;">
            <button id="theme-toggle" class="theme-toggle">☀️</button>
        </div>
    </nav>

    <div class="dashboard">
        <aside class="glass-panel sidebar">
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="calculator.html" class="active">Calculator</a></li>
                <li><a href="history.html">History</a></li>
                <li><a href="strategy.html">Strategy Analyzer</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <h2 style="margin-bottom: 1.5rem;">Profit / Loss Calculator</h2>
            
            <div class="glass-panel form-container" style="margin: 0; max-width: 600px;">
                <div id="alertBox" class="alert"></div>
                <form id="calcForm">
                    <div class="form-group">
                        <label for="stockName">Stock Name</label>
                        <input type="text" id="stockName" required>
                    </div>
                    <div class="form-group">
                        <label for="buyPrice">Buy Price (₹)</label>
                        <input type="number" step="0.01" id="buyPrice" required>
                    </div>
                    <div class="form-group">
                        <label for="sellPrice">Sell Price (₹)</label>
                        <input type="number" step="0.01" id="sellPrice" required>
                    </div>
                    <div class="form-group">
                        <label for="quantity">Quantity</label>
                        <input type="number" id="quantity" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Calculate & Save</button>
                </form>

                <div id="resultBox" style="margin-top: 2rem; display: none;">
                    <h3>Result</h3>
                    <p style="font-size: 1.5rem; font-weight: 700; margin-top: 0.5rem;" id="calcResultText"></p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/theme.js"></script>
    <script>
        const userId = localStorage.getItem('userId');
        if (!userId) window.location.href = 'login.html';

        document.getElementById('calcForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const stockName = document.getElementById('stockName').value;
            const buyPrice = parseFloat(document.getElementById('buyPrice').value);
            const sellPrice = parseFloat(document.getElementById('sellPrice').value);
            const quantity = parseInt(document.getElementById('quantity').value);
            const alertBox = document.getElementById('alertBox');
            const resultBox = document.getElementById('resultBox');
            const calcResultText = document.getElementById('calcResultText');

            try {
                const res = await fetch('/api/calculations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stockName, buyPrice, sellPrice, quantity, userId: parseInt(userId) })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    alertBox.className = 'alert success';
                    alertBox.textContent = 'Calculation saved successfully!';
                    
                    resultBox.style.display = 'block';
                    if (data.profit >= 0) {
                        calcResultText.textContent = `Profit: ₹${data.profit.toFixed(2)}`;
                        calcResultText.style.color = 'var(--accent-color)';
                    } else {
                        calcResultText.textContent = `Loss: ₹${Math.abs(data.profit).toFixed(2)}`;
                        calcResultText.style.color = 'var(--danger-color)';
                    }
                    
                    document.getElementById('calcForm').reset();
                } else {
                    alertBox.className = 'alert error';
                    alertBox.textContent = data.error || 'Failed to save calculation.';
                }
            } catch (err) {
                alertBox.className = 'alert error';
                alertBox.textContent = 'Server error. Please try again.';
            }
        });
    </script>
</body>
</html>
