<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - StockDeck</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <nav class="topbar">
        <a href="dashboard.html" class="brand">StockDeck</a>
        <div class="links" style="display: flex; align-items: center;">
            <button id="theme-toggle" class="theme-toggle">☀️</button>
        </div>
    </nav>

    <div class="app-container">
        <aside class="sidebar">
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="calculator.html" class="active">Calculator</a></li>
                <li><a href="history.html">History</a></li>
                <li><a href="strategy.html">Strategy Analyzer</a></li>
            </ul>
        </aside>

        <main class="main-content" style="align-items: center;">
            <div style="width: 100%; max-width: 600px;">
                <h2 style="margin-bottom: 2rem;">Profit / Loss Calculator</h2>
                
                <div class="glass-panel" style="padding: 2.5rem; border-radius: 20px;">
                    <form id="calcForm">
                    <div class="form-group">
                        <label for="stockName">Stock Name</label>
                        <input type="text" id="stockName" required>
                    </div>
                    <div class="form-group">
                        <label for="buyPrice">Buy Price (₹)</label>
                        <input type="number" step="0.01" id="buyPrice" required>
                    </div>
                    <div class="form-group">
                        <label for="sellPrice">Sell Price (₹)</label>
                        <input type="number" step="0.01" id="sellPrice" required>
                    </div>
                    <div class="form-group">
                        <label for="quantity">Quantity</label>
                        <input type="number" id="quantity" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Calculate & Save</button>
                </form>

                    <div id="resultBox" style="margin-top: 2rem; display: none; padding-top: 1.5rem; border-top: 1px solid var(--card-border); text-align: center;">
                        <h3 style="opacity: 0.8; font-size: 0.95rem;">Result</h3>
                        <p style="font-size: 1.8rem; font-weight: 700; margin-top: 0.5rem;" id="calcResultText"></p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/toast.js"></script>
    <script>
        const userId = localStorage.getItem('userId');
        if (!userId) window.location.href = 'login.html';

        // Live Price Fetching
        document.getElementById('stockName').addEventListener('blur', async (e) => {
            const ticker = e.target.value.trim();
            if (!ticker) return;
            
            const buyPriceInput = document.getElementById('buyPrice');
            buyPriceInput.classList.add('skeleton'); // Show skeleton loader
            
            try {
                const res = await fetch(`/api/stock/quote/${ticker}`);
                const data = await res.json();
                if (res.ok && data.price) {
                    buyPriceInput.value = parseFloat(data.price).toFixed(2);
                    showToast(`Live price fetched for ${data.symbol}`, 'success');
                } else {
                    showToast('Could not fetch live price, please enter manually.', 'error');
                }
            } catch (err) {
                console.error(err);
            } finally {
                buyPriceInput.classList.remove('skeleton'); // Remove skeleton loader
            }
        });

        document.getElementById('calcForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const stockName = document.getElementById('stockName').value;
            const buyPrice = parseFloat(document.getElementById('buyPrice').value);
            const sellPrice = parseFloat(document.getElementById('sellPrice').value);
            const quantity = parseInt(document.getElementById('quantity').value);
            const resultBox = document.getElementById('resultBox');
            const calcResultText = document.getElementById('calcResultText');

            try {
                const res = await fetch('/api/calculations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stockName, buyPrice, sellPrice, quantity, userId: parseInt(userId) })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    showToast('Calculation saved successfully!', 'success');
                    
                    resultBox.style.display = 'block';
                    if (data.profit >= 0) {
                        calcResultText.textContent = `Profit: ₹${data.profit.toFixed(2)}`;
                        calcResultText.style.color = 'var(--accent-color)';
                    } else {
                        calcResultText.textContent = `Loss: ₹${Math.abs(data.profit).toFixed(2)}`;
                        calcResultText.style.color = 'var(--danger-color)';
                    }
                    
                    document.getElementById('calcForm').reset();
                } else {
                    showToast(data.error || 'Failed to save calculation.', 'error');
                }
            } catch (err) {
                showToast('Server error. Please try again.', 'error');
            }
        });
    </script>
</body>
</html>
