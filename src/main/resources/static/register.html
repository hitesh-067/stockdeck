<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - StockDeck</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar" style="position: fixed; width: 100%; top: 0; left: 0; padding: 1rem 2rem;">
        <div style="font-size: 1.5rem; font-weight: 700; color: var(--primary-color);">StockDeck</div>
        <div style="display: flex; gap: 1.5rem; align-items: center;">
            <a href="index.html" style="color: var(--text-color); text-decoration: none;">Home</a>
            <a href="login.html" class="btn btn-outline">Login</a>
            <button id="theme-toggle" class="theme-toggle">☀️</button>
        </div>
    </header>

    <main style="display: flex; justify-content: center; align-items: center; min-height: 100vh; position: relative; overflow: hidden;">
        <div class="ambient-glow" style="top: 50%; left: 50%; transform: translate(-50%, -50%); width: 600px; height: 600px; background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(0, 0, 0, 0) 70%);"></div>
        
        <div class="glass-panel form-container" style="width: 100%; max-width: 400px; padding: 3rem 2rem; border-radius: 20px; position: relative; z-index: 10;">
            <h2 style="margin-bottom: 1.5rem; text-align: center;">Create Account</h2>
            <div id="alertBox" class="alert"></div>
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
            </form>
            <p style="margin-top: 1.5rem; text-align: center; opacity: 0.8;">
                Already have an account? <a href="login.html" style="color: var(--primary-color);">Login here</a>
            </p>
        </div>
    </main>

    <script src="js/theme.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    // Auto-login after registration
                    localStorage.setItem('userId', data.userId);
                    localStorage.setItem('username', username);
                    
                    alertBox.className = 'alert success';
                    alertBox.textContent = 'Account created! Heading to dashboard...';
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                } else {
                    alertBox.className = 'alert error';
                    alertBox.textContent = data.error || 'Registration failed.';
                }
            } catch (err) {
                alertBox.className = 'alert error';
                alertBox.textContent = 'Server error. Please try again.';
            }
        });
    </script>
</body>
</html>
