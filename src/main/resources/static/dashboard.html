<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - StockDeck</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav>
        <a href="dashboard.html" class="brand">StockDeck</a>
        <div class="links" style="display: flex; align-items: center;">
            <span id="nav-username" style="font-weight: 600; margin-right: 1rem;"></span>
            <button id="logoutBtn" class="btn btn-danger">Logout</button>
            <button id="theme-toggle" class="theme-toggle">☀️</button>
        </div>
    </nav>

    <div class="dashboard">
        <aside class="glass-panel sidebar">
            <ul>
                <li><a href="dashboard.html" class="active">Dashboard</a></li>
                <li><a href="calculator.html">Calculator</a></li>
                <li><a href="history.html">History</a></li>
                <li><a href="strategy.html">Strategy Analyzer</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <h2 style="margin-bottom: 0.5rem;">Welcome back, <span id="welcome-name"></span>! 👋</h2>
            
            <div class="stats-grid">
                <div class="glass-panel stat-card">
                    <h3>Total Calculations</h3>
                    <div class="value" id="stat-calcs">0</div>
                </div>
                <div class="glass-panel stat-card">
                    <h3>Total Profit</h3>
                    <div class="value" id="stat-profit" style="color: var(--accent-color);">₹0</div>
                </div>
                <div class="glass-panel stat-card">
                    <h3>Total Loss</h3>
                    <div class="value" id="stat-loss" style="color: var(--danger-color);">₹0</div>
                </div>
                <div class="glass-panel stat-card">
                    <h3>Top Stock</h3>
                    <div class="value" id="stat-top-stock" style="font-size: 1.5rem;">N/A</div>
                    <div style="font-size: 0.9rem; color: var(--accent-color);" id="stat-top-profit"></div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="glass-panel chart-card">
                    <h3 style="margin-bottom: 1rem; text-align: center;">Profit / Loss Distribution</h3>
                    <canvas id="doughnutChart"></canvas>
                </div>
                <div class="glass-panel chart-card">
                    <h3 style="margin-bottom: 1rem; text-align: center;">Profit Trend</h3>
                    <canvas id="lineChart"></canvas>
                </div>
            </div>
        </main>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
