<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - StockDeck</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=3">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
    
    <!-- jsPDF and AutoTable for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    
    <nav class="topbar">
        <button id="mobileMenuBtn" class="mobile-menu-btn">☰</button>
        <a href="dashboard.html" class="brand">StockDeck</a>
        <div class="links" style="display: flex; align-items: center;">
            <button id="theme-toggle" class="theme-toggle">☀️</button>
        </div>
    </nav>

    <div class="app-container">
        <aside class="sidebar" style="display: flex; flex-direction: column; justify-content: space-between;">
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="calculator.html">Calculator</a></li>
                <li><a href="history.html" class="active">History</a></li>
                <li><a href="strategy.html">Strategy Analyzer</a></li>
                <li style="margin-top: 1rem;">
                    <a href="#" onclick="localStorage.clear(); window.location.href='login.html'; return false;" style="color: var(--danger-color); display: flex; align-items: center; gap: 0.5rem; font-weight: 500;">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg> 
                        Logout
                    </a>
                </li>
            </ul>
            <div class="sidebar-logo" style="padding: 1.5rem; text-align: center; margin-top: auto; opacity: 1; display: flex; flex-direction: column; align-items: center; gap: 1rem;">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.3)); color: var(--text-color);">
                    <path d="M3 3V21H21" stroke="currentColor" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M7 14L11 9L15 13L21 5" stroke="var(--primary-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="21" cy="5" r="3" fill="var(--primary-color)"/>
                    <circle cx="15" cy="13" r="2" fill="currentColor" fill-opacity="0.3"/>
                    <circle cx="11" cy="9" r="2" fill="currentColor" fill-opacity="0.3"/>
                    <circle cx="7" cy="14" r="2" fill="currentColor" fill-opacity="0.3"/>
                </svg>
                <div style="font-size: 0.8rem; letter-spacing: 0.1em; color: var(--text-color); opacity: 0.8; font-weight: 600; text-transform: uppercase;">Pro Analytics</div>
            </div>
        </aside>

        <main class="main-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <h2 style="font-size: 2rem; letter-spacing: -0.02em;">Transaction History</h2>
                <div>
                    <button id="exportCsvBtn" class="btn btn-outline" style="margin-right: 0.5rem;">📥 CSV</button>
                    <button id="exportPdfBtn" class="btn btn-primary" style="margin-right: 0.5rem;">📄 PDF</button>
                    <button id="clearHistoryBtn" class="btn btn-danger">🗑️ Clear History</button>
                </div>
            </div>
            
            <div class="table-container">
                <table id="historyTable">
                    <thead>
                        <tr>
                            <th>Stock Name</th>
                            <th>Buy Price</th>
                            <th>Sell Price</th>
                            <th>Quantity</th>
                            <th>Profit/Loss</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data populated by JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- jQuery & DataTables JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    
    <script src="js/theme.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/mobile.js"></script>
    <script>
        const userId = localStorage.getItem('userId');
        if (!userId) window.location.href = 'login.html';

        let dataTable;

        async function fetchHistory() {
            try {
                const tbody = document.querySelector('#historyTable tbody');
                tbody.innerHTML = '<tr><td colspan="6" class="skeleton" style="height: 40px; margin-bottom: 5px;">Loading</td></tr><tr><td colspan="6" class="skeleton" style="height: 40px;">Loading</td></tr>';

                const res = await fetch(`/api/calculations/history/${userId}`);
                const history = await res.json();
                
                if (dataTable) {
                    dataTable.destroy();
                }
                
                tbody.innerHTML = '';

                if (history.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No records found.</td></tr>';
                    return;
                }

                history.forEach(item => {
                    const tr = document.createElement('tr');
                    const isProfit = item.profit >= 0;
                    const profitColor = isProfit ? 'var(--accent-color)' : 'var(--danger-color)';
                    
                    tr.innerHTML = `
                        <td>${item.stockName}</td>
                        <td>₹${item.buyPrice.toFixed(2)}</td>
                        <td>₹${item.sellPrice.toFixed(2)}</td>
                        <td>${item.quantity}</td>
                        <td style="color: ${profitColor}; font-weight: 600;" data-order="${item.profit}">₹${item.profit.toFixed(2)}</td>
                        <td><button class="btn btn-danger" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;" onclick="deleteRecord(${item.id})">Delete</button></td>
                    `;
                    tbody.appendChild(tr);
                });

                // Initialize DataTables
                dataTable = $('#historyTable').DataTable({
                    pageLength: 10,
                    lengthChange: false,
                    info: true,
                    searching: true,
                    order: [[4, 'desc']], // Default sort by highest profit
                    language: {
                        search: "_INPUT_",
                        searchPlaceholder: "Search records..."
                    }
                });
            } catch (err) {
                console.error('Failed to fetch history', err);
                showToast('Failed to fetch history', 'error');
            }
        }

        async function deleteRecord(id) {
            if (!confirm('Are you sure you want to delete this record?')) return;
            try {
                const res = await fetch(`/api/calculations/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    showToast('Record deleted.', 'success');
                    fetchHistory();
                }
            } catch (err) {
                console.error('Failed to delete', err);
                showToast('Failed to delete record', 'error');
            }
        }

        document.getElementById('clearHistoryBtn').addEventListener('click', async () => {
            if (!confirm('Are you sure you want to clear ALL history?')) return;
            try {
                const res = await fetch(`/api/calculations/clear/${userId}`, { method: 'DELETE' });
                if (res.ok) {
                    showToast('All history cleared!', 'success');
                    fetchHistory();
                }
            } catch (err) {
                console.error('Failed to clear', err);
                showToast('Failed to clear history', 'error');
            }
        });
        
        // Export to CSV
        document.getElementById('exportCsvBtn').addEventListener('click', () => {
            if (!dataTable) return;
            let csv = 'Stock Name,Buy Price,Sell Price,Quantity,Profit/Loss\n';
            dataTable.rows().data().toArray().forEach(row => {
                // Remove ₹ and HTML tags before exporting
                const cleanRow = row.slice(0, 5).map(cell => {
                    const text = $('<div>').html(cell).text();
                    return text.replace(/₹/g, '').replace(/,/g, '');
                });
                csv += cleanRow.join(',') + '\n';
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'StockDeck_History.csv');
            a.click();
            window.URL.revokeObjectURL(url);
            
            showToast('Exported to CSV!', 'success');
        });

        // Export to PDF
        document.getElementById('exportPdfBtn').addEventListener('click', () => {
            if (!dataTable) return;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Header
            doc.setFontSize(22);
            doc.setTextColor(59, 130, 246);
            doc.text('StockDeck', 14, 20);

            doc.setFontSize(14);
            doc.setTextColor(30, 30, 30);
            doc.text('Transaction History Report', 14, 30);

            const date = new Date().toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' });
            doc.setFontSize(10);
            doc.setTextColor(120, 120, 120);
            doc.text('Generated on: ' + date, 14, 37);

            // Build table body from raw API data stored on each <tr>
            // We read directly from the DataTables API using node() to get the raw values
            const head = [['Stock Name', 'Buy Price (Rs.)', 'Sell Price (Rs.)', 'Quantity', 'Profit / Loss (Rs.)']];
            const body = [];
            const profitValues = []; // store raw profit numbers for color coding

            dataTable.rows().every(function() {
                const rowNode = this.node();
                const cells = rowNode.querySelectorAll('td');
                // cells[0]=stock, [1]=buyPrice, [2]=sellPrice, [3]=qty, [4]=profit, [5]=action
                const stockName  = cells[0].textContent.trim();
                const buyPrice   = cells[1].textContent.trim().replace(/[\u20B9]/g, 'Rs. ');
                const sellPrice  = cells[2].textContent.trim().replace(/[\u20B9]/g, 'Rs. ');
                const qty        = cells[3].textContent.trim();
                // Use data-order attribute for the raw numeric profit value
                const rawProfit  = parseFloat(cells[4].getAttribute('data-order') || '0');
                const profitText = 'Rs. ' + Math.abs(rawProfit).toFixed(2) + (rawProfit < 0 ? ' (Loss)' : ' (Profit)');

                body.push([stockName, buyPrice, sellPrice, qty, profitText]);
                profitValues.push(rawProfit);
            });

            doc.autoTable({
                head: head,
                body: body,
                startY: 45,
                theme: 'striped',
                styles: { font: 'helvetica', fontSize: 10 },
                headStyles: { fillColor: [59, 130, 246], textColor: 255, fontStyle: 'bold' },
                alternateRowStyles: { fillColor: [245, 248, 255] },
                didParseCell: function(data) {
                    if (data.section === 'body' && data.column.index === 4) {
                        const val = profitValues[data.row.index];
                        if (val > 0) {
                            data.cell.styles.textColor = [16, 185, 129]; // Green
                            data.cell.styles.fontStyle = 'bold';
                        } else if (val < 0) {
                            data.cell.styles.textColor = [220, 38, 38];  // Red
                            data.cell.styles.fontStyle = 'bold';
                        }
                    }
                }
            });

            // Footer
            const pageCount = doc.internal.getNumberOfPages();
            for (let i = 1; i <= pageCount; i++) {
                doc.setPage(i);
                doc.setFontSize(8);
                doc.setTextColor(160, 160, 160);
                doc.text('StockDeck - Confidential Report | Page ' + i + ' of ' + pageCount,
                    doc.internal.pageSize.getWidth() / 2, doc.internal.pageSize.getHeight() - 8,
                    { align: 'center' });
            }

            doc.save('StockDeck_History_Report.pdf');
            showToast('PDF exported successfully!', 'success');
        });

        // Keep Render warm: ping the server every 10 minutes so the free-tier doesn't spin down
        setInterval(() => {
            fetch('/api/ping').catch(() => {}); // silent fail
        }, 10 * 60 * 1000);

        fetchHistory();
    </script>
</body>
</html>
