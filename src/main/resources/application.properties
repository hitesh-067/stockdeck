spring.application.name=stockdeck
server.port=${PORT:8080}

# Database connection (Uses Render's PostgreSQL if DB_URL is set, otherwise falls back to local H2)
spring.datasource.url=${DB_URL:jdbc:h2:mem:stockdeckdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Allow Hibernate to automatically detect the dialect (PostgreSQL vs H2) based on the active connection URL
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Static resources mapping (useful if we want html served natively)
spring.web.resources.static-locations=classpath:/static/
